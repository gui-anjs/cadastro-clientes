<div class="container">
    <h2>Consulta</h2>
  
    <!-- Campo de Pesquisa -->
    <mat-form-field appearance="fill" class="pesquisa-box">
      <mat-label>Nome:</mat-label>
      <input matInput (keyup)="aplicarFiltro($event)" placeholder="Pesquisar cliente...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  
    <h3>Resultado</h3>
  
    <!-- Tabela de Clientes -->
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
      <!-- Coluna Nome -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let cliente"> {{cliente.nome}} </td>
      </ng-container>
  
     <!-- Coluna CPF com a função de máscara -->
    <ng-container matColumnDef="cpf">
      <th mat-header-cell *matHeaderCellDef> CPF </th>
      <td mat-cell *matCellDef="let element"> {{ formatarCpf(element.cpf) }} </td>
    </ng-container>

    <!-- Coluna Data Nascimento com o Pipe de Data funcionando -->
    <ng-container matColumnDef="dataNascimento">
      <th mat-header-cell *matHeaderCellDef> Data Nascimento </th>
      <td mat-cell *matCellDef="let element"> {{ element.dataNascimento | date:'dd/MM/yyyy' }} </td>
    </ng-container>
  
      <!-- Coluna Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let cliente"> {{cliente.email}} </td>
      </ng-container>
  
      <!-- Coluna Ações (Editar e Deletar) -->
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let cliente" class="acoes-cell">
          <button mat-button color="primary" [routerLink]="['/editar', cliente.id]">
            <mat-icon>edit</mat-icon> Editar
          </button>
          <button mat-button color="warn" (click)="deletarCliente(cliente.id)">
            <mat-icon>delete</mat-icon> Deletar
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas;"></tr>
      
      <!-- Mensagem caso a pesquisa não encontre nada -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="6">Nenhum dado encontrado</td>
      </tr>
    </table>
  </div>
